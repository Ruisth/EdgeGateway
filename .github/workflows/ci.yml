name: CI

on:
  push:
    branches: [main, dev, "claude/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      - name: ruff check
        run: ruff check services/

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service dependencies
        run: |
          pip install mypy
          pip install -r services/egw-controller/requirements.txt
          pip install -r services/didcomm-agent/requirements.txt
          pip install -r services/smart-device-simulator/requirements.txt

      - name: mypy
        run: mypy

  security-python:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install 'bandit[toml]'

      - name: bandit (medium+high severity, medium+high confidence)
        run: bandit -r services/ -ll -ii --exclude services/didcomm-agent/data,services/*/tests

  lint-dockerfiles:
    name: Lint Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - services/egw-controller/Dockerfile
          - services/didcomm-agent/Dockerfile
          - services/smart-device-simulator/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  lint-workflows:
    name: Lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test-sd-simulator:
    name: Test SD Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/smart-device-simulator
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/smart-device-simulator
        run: python -m pytest tests/ -v

  test-egw-controller:
    name: Test EGW Controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/egw-controller
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/egw-controller
        run: python -m pytest tests/ -v

  test-didcomm-agent:
    name: Test DIDComm Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/didcomm-agent
        run: pip install -e ".[dev,api]"

      - name: Run tests
        working-directory: services/didcomm-agent
        run: python -m pytest tests/ -v

  test-integration-smoke:
    name: Integration smoke (skipped without services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest + integration deps
        run: pip install pytest paho-mqtt requests

      - name: Collect integration tests (asserts they import cleanly)
        run: |
          pytest --collect-only -q \
            services/ditto/tests \
            services/ipfs/tests \
            services/mosquitto/tests

      - name: Run integration tests (will skip when services aren't reachable)
        run: |
          pytest -v \
            services/ditto/tests \
            services/ipfs/tests \
            services/mosquitto/tests

  test-chaincode:
    name: Test Go Chaincodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Vet device-lifecycle
        working-directory: services/fabric/chaincode/device-lifecycle
        run: go vet ./...

      - name: Vet dataset-tracking
        working-directory: services/fabric/chaincode/dataset-tracking
        run: go vet ./...

      - name: gosec device-lifecycle
        uses: securego/gosec@master
        with:
          args: ./services/fabric/chaincode/device-lifecycle/...

      - name: gosec dataset-tracking
        uses: securego/gosec@master
        with:
          args: ./services/fabric/chaincode/dataset-tracking/...

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - lint-dockerfiles
      - test-sd-simulator
      - test-egw-controller
      - test-didcomm-agent
    steps:
      - uses: actions/checkout@v4

      - name: Build SD Simulator
        run: docker build -t edgegateway/sd-simulator:ci ./services/smart-device-simulator

      - name: Build EGW Controller
        run: docker build -t edgegateway/egw-controller:ci ./services/egw-controller

      - name: Build DIDComm Agent
        run: docker build -t edgegateway/didcomm-agent:ci ./services/didcomm-agent
