name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python (ruff)
        run: ruff check services/

  test-sd-simulator:
    name: Test SD Simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/smart-device-simulator
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt && pip install pytest

      - name: Run tests
        working-directory: services/smart-device-simulator
        run: python -m pytest tests/ -v

  test-egw-controller:
    name: Test EGW Controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/egw-controller
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/egw-controller
        run: python -m pytest tests/ -v

  test-didcomm-agent:
    name: Test DIDComm Agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/didcomm-agent
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt && pip install pytest

      - name: Run tests
        working-directory: services/didcomm-agent
        run: python -m pytest tests/ -v

  test-chaincode:
    name: Test Go Chaincodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Vet device-lifecycle
        working-directory: services/fabric/chaincode/device-lifecycle
        run: go vet ./...

      - name: Vet dataset-tracking
        working-directory: services/fabric/chaincode/dataset-tracking
        run: go vet ./...

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-sd-simulator, test-egw-controller]
    steps:
      - uses: actions/checkout@v4

      - name: Build SD Simulator
        run: docker build -t edgegateway/sd-simulator:ci ./services/smart-device-simulator

      - name: Build EGW Controller
        run: docker build -t edgegateway/egw-controller:ci ./services/egw-controller

      - name: Build DIDComm Agent
        run: docker build -t edgegateway/didcomm-agent:ci ./services/didcomm-agent
