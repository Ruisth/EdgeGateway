# =============================================================================
# Hyperledger Fabric — Rede C2DTA (dev)
# =============================================================================
# Topologia minima: 1 orderer + 2 orgs (ConsortiumOrg + OEMOrg)
# CouchDB para rich queries nos chaincodes

services:
  # ---------- Orderer ----------
  orderer.c2dta.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: c2dta-orderer
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    volumes:
      - ./organizations/ordererOrganizations/c2dta.example.com/orderers/orderer.c2dta.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/c2dta.example.com/orderers/orderer.c2dta.example.com/tls:/var/hyperledger/orderer/tls
      - orderer-data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    restart: unless-stopped

  # ---------- Consortium Peer ----------
  couchdb0:
    image: couchdb:3.3
    container_name: c2dta-couchdb0
    environment:
      - COUCHDB_USER=${COUCHDB_USER:?set via repo-root .env (run with --env-file ../../.env)}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?set via repo-root .env (run with --env-file ../../.env)}
    volumes:
      - couchdb0-data:/opt/couchdb/data
    restart: unless-stopped

  peer0.consortium.c2dta.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: c2dta-peer0-consortium
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.consortium.c2dta.example.com
      - CORE_PEER_ADDRESS=peer0.consortium.c2dta.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.consortium.c2dta.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.consortium.c2dta.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.consortium.c2dta.example.com:7051
      - CORE_PEER_LOCALMSPID=ConsortiumMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:?set via repo-root .env (run with --env-file ../../.env)}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:?set via repo-root .env (run with --env-file ../../.env)}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/consortium.c2dta.example.com/peers/peer0.consortium.c2dta.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/consortium.c2dta.example.com/peers/peer0.consortium.c2dta.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0-consortium-data:/var/hyperledger/production
    ports:
      - "7051:7051"
    depends_on:
      - couchdb0
    restart: unless-stopped

  # ---------- OEM Peer ----------
  couchdb1:
    image: couchdb:3.3
    container_name: c2dta-couchdb1
    environment:
      - COUCHDB_USER=${COUCHDB_USER:?set via repo-root .env (run with --env-file ../../.env)}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?set via repo-root .env (run with --env-file ../../.env)}
    volumes:
      - couchdb1-data:/opt/couchdb/data
    restart: unless-stopped

  peer0.oem.c2dta.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: c2dta-peer0-oem
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.oem.c2dta.example.com
      - CORE_PEER_ADDRESS=peer0.oem.c2dta.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.oem.c2dta.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.oem.c2dta.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.oem.c2dta.example.com:9051
      - CORE_PEER_LOCALMSPID=OEMMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:?set via repo-root .env (run with --env-file ../../.env)}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:?set via repo-root .env (run with --env-file ../../.env)}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/oem.c2dta.example.com/peers/peer0.oem.c2dta.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/oem.c2dta.example.com/peers/peer0.oem.c2dta.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0-oem-data:/var/hyperledger/production
    ports:
      - "9051:9051"
    depends_on:
      - couchdb1
    restart: unless-stopped

  # ---------- Fabric CA (ConsortiumOrg) ----------
  ca.consortium.c2dta.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: c2dta-ca-consortium
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-consortium
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ca-consortium-data:/etc/hyperledger/fabric-ca-server
    restart: unless-stopped

  # ---------- Fabric CA (OEMOrg) ----------
  ca.oem.c2dta.example.com:
    image: hyperledger/fabric-ca:1.5
    container_name: c2dta-ca-oem
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-oem
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    volumes:
      - ca-oem-data:/etc/hyperledger/fabric-ca-server
    restart: unless-stopped

  # ---------- CLI ----------
  cli:
    image: hyperledger/fabric-tools:2.5
    container_name: c2dta-fabric-cli
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
    volumes:
      - ./organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ./chaincode:/opt/gopath/src/github.com/chaincode
      - ./scripts:/opt/gopath/src/github.com/scripts
    depends_on:
      - peer0.consortium.c2dta.example.com
      - peer0.oem.c2dta.example.com
    restart: unless-stopped

volumes:
  orderer-data:
  peer0-consortium-data:
  peer0-oem-data:
  couchdb0-data:
  couchdb1-data:
  ca-consortium-data:
  ca-oem-data:
