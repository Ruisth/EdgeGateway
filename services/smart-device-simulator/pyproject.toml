[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-device-simulator"
version = "0.1.0"
description = "Simulador de smartwatch C2DTA — gera heartbeat, geolocalizacao e timestamp a 1 Hz via MQTT/TLS"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0,<3",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
    "mypy>=1.11",
]
