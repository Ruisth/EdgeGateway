# =============================================================================
# ACL — Controlo de acesso por topico MQTT
# =============================================================================
# Hierarquia de topicos C2DTA:
#   egw/<device_uuid>/telemetry   — dados sensoriais do SD para o DT
#   egw/<device_uuid>/command     — comandos do EGW para o SD
#   egw/<device_uuid>/status      — estado do dispositivo
#   egw/system/#                  — topicos de sistema do EGW
#
# Autenticacao por certificado: o CN do certificado cliente e usado como username.

# ---------------------------------------------------------------------------
# Smart Devices (SD) — podem publicar telemetria e subscrever comandos
# O padrao %u corresponde ao CN do certificado (= device UUID)
# ---------------------------------------------------------------------------
pattern readwrite egw/%u/telemetry
pattern read egw/%u/command
pattern readwrite egw/%u/status

# ---------------------------------------------------------------------------
# Edge Gateway (EGW) — pode ler/escrever em todos os topicos egw/
# O CN do certificado EGW deve ser "edgegateway"
# ---------------------------------------------------------------------------
user edgegateway
topic readwrite egw/#

# ---------------------------------------------------------------------------
# Eclipse Ditto (conectividade MQTT) — pode ler telemetria de todos os SDs
# O CN do certificado Ditto deve ser "ditto-connectivity"
# ---------------------------------------------------------------------------
user ditto-connectivity
topic read egw/+/telemetry
topic read egw/+/status
