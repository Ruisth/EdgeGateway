# =============================================================================
# Eclipse Mosquitto — Configuracao C2DTA Edge Gateway
# =============================================================================
# Broker MQTT com TLS obrigatorio para comunicacao segura entre Smart Devices
# e o Edge Gateway. Alinhado com o paper EdgeGateway_Paper.pdf (Seccao 3.2.6).

# ---------------------------------------------------------------------------
# Listener TLS (porta 8883)
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

require_certificate true
use_identity_as_username true

tls_version tlsv1.2

# ---------------------------------------------------------------------------
# Listener sem TLS apenas para saude/diagnostico interno (porta 1883)
# Restrito ao container (nao exposto ao host)
# ---------------------------------------------------------------------------
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

# ---------------------------------------------------------------------------
# Autenticacao e autorizacao
# ---------------------------------------------------------------------------
allow_anonymous false
acl_file /mosquitto/config/acl.conf

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------------------
# Limites
# ---------------------------------------------------------------------------
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 1048576

# ---------------------------------------------------------------------------
# Keepalive
# ---------------------------------------------------------------------------
max_keepalive 120
