worker_processes auto;

events {
    worker_connections 512;
}

http {
    charset utf-8;
    default_type application/json;

    # Timeouts alinhados com os SLAs do C2DTA (< 5s twin sync)
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    upstream ditto-gateway {
        server ditto-gateway:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (sem auth)
        location /status {
            return 200 '{"status":"ok"}';
        }

        # Ditto API — autenticacao basica (dev)
        location /api/ {
            auth_basic "C2DTA Ditto";
            auth_basic_user_file /etc/nginx/nginx.htpasswd;

            proxy_pass http://ditto-gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Ditto precisa do header pre-authenticated para dummy auth
            proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";
        }

        # Ditto DevOps API (apenas para admin)
        location /devops/ {
            auth_basic "C2DTA Ditto DevOps";
            auth_basic_user_file /etc/nginx/nginx.htpasswd;

            proxy_pass http://ditto-gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Ditto WebSocket (SSE/WS)
        location /ws/ {
            auth_basic "C2DTA Ditto";
            auth_basic_user_file /etc/nginx/nginx.htpasswd;

            proxy_pass http://ditto-gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header x-ditto-pre-authenticated "nginx:${remote_user}";
        }
    }
}
