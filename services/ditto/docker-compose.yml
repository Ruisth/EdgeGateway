services:
  # ---------- Base de dados ----------
  mongodb:
    image: mongo:6.0
    container_name: c2dta-ditto-mongodb
    volumes:
      - ditto-mongodb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Servicos Eclipse Ditto 3.x ----------
  ditto-policies:
    image: eclipse/ditto-policies:3.5.6
    container_name: c2dta-ditto-policies
    environment:
      - MONGO_DB_URI=mongodb://mongodb:27017/policies
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ditto-things:
    image: eclipse/ditto-things:3.5.6
    container_name: c2dta-ditto-things
    environment:
      - MONGO_DB_URI=mongodb://mongodb:27017/things
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ditto-things-search:
    image: eclipse/ditto-things-search:3.5.6
    container_name: c2dta-ditto-things-search
    environment:
      - MONGO_DB_URI=mongodb://mongodb:27017/things-search
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ditto-connectivity:
    image: eclipse/ditto-connectivity:3.5.6
    container_name: c2dta-ditto-connectivity
    environment:
      - MONGO_DB_URI=mongodb://mongodb:27017/connectivity
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  ditto-gateway:
    image: eclipse/ditto-gateway:3.5.6
    container_name: c2dta-ditto-gateway
    environment:
      - ENABLE_DUMMY_AUTH=true
      - DEVOPS_PASSWORD=c2dta-devops
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx256m
    depends_on:
      - ditto-policies
      - ditto-things
      - ditto-things-search
      - ditto-connectivity
    restart: unless-stopped

  # ---------- Reverse proxy ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: c2dta-ditto-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.htpasswd:/etc/nginx/nginx.htpasswd:ro
    depends_on:
      - ditto-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/status"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  ditto-mongodb-data:
